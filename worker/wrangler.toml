# Use this config to serve the built site AND the API from the Worker.
# Build web/ first, then run: npm run deploy:site
# Keep secrets and vars in sync with wrangler.toml.

name = "snipetag-api"
main = "src/index.ts"
compatibility_date = "2026-11-20"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
SITE_URL = "https://snipetag.synchstream.workers.dev"
APP_URL = "https://snipetag.synchstream.workers.dev"
ALERTS_FROM_EMAIL = "SnipeTag <alerts@snipetag.app>"
ALLOWED_ORIGIN = "https://snipetag.synchstream.workers.dev"

# Optional: richer Web Push text.
# [[kv_namespaces]]
# binding = "PUSH_KV"
# id = "your-kv-namespace-id"

[triggers]
crons = ["*/5 * * * *"]

[assets]
directory = "../web/dist"
binding = "ASSETS"
