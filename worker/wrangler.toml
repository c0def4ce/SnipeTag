name = "snipetag-api"
main = "src/index.ts"
compatibility_date = "2026-11-20"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Origin of the GitHub Pages site (comma-separated for multiple origins)
[vars]
# Public site origin (GitHub Pages or Worker custom domain)
SITE_URL = "https://username.github.io/SnipeTag"
APP_URL = "https://snipetag-api.example.workers.dev"
ALERTS_FROM_EMAIL = "SnipeTag <alerts@snipetag.app>"
ALLOWED_ORIGIN = "https://username.github.io"

# Optional: enriches Web Push messages with product-specific text.
# Create with `npx wrangler kv namespace create PUSH_KV`, then uncomment and set the ID.
# [[kv_namespaces]]
# binding = "PUSH_KV"
# id = "your-kv-namespace-id"

[triggers]
crons = ["*/5 * * * *"]

# This Worker is API-only by default: the static site is hosted on GitHub Pages.
# To serve web/dist from the Worker instead, build the site first and add:
#   [assets]
#   directory = "../web/dist"
#   binding = "ASSETS"
