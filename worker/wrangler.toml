name = "snipetag-api"
main = "src/index.ts"
compatibility_date = "2026-11-20"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Origin of the GitHub Pages site (comma-separated for multiple origins)
[vars]
# Public site origin (GitHub Pages or Worker custom domain)
SITE_URL = "https://username.github.io/SnipeTag"
APP_URL = "https://snipetag-api.example.workers.dev"
ALERTS_FROM_EMAIL = "SnipeTag <alerts@snipetag.app>"
ALLOWED_ORIGIN = "https://username.github.io"

[[kv_namespaces]]
binding = "PUSH_KV"
id = "replace-with-your-kv-namespace-id"

[triggers]
crons = ["*/5 * * * *"]

# Optional: let the Worker also serve the built static site (web/dist).
[assets]
directory = "../web/dist"
binding = "ASSETS"
